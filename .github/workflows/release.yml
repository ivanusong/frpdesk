# 发布工作流：推送 annotated 的 v x.y.z tag 触发。版本只来自 tag（scripts/tag-version.sh，
# 不读取仓库内版本文件），发布日志（GitHub Release 描述与 updater stable.json notes）
# 也取自 tag 描述（scripts/tag-release-notes.sh，轻量 tag 或描述为空直接失败），
# 然后复用 build.sh 构建三目标产物，生成 Wails updater stable.json，并以 GitHub Release 发布。
# 与本地私有发布流程（MinIO/rclone）无关；普通 Build 工作流保持只读、不发布。
# 另含独立的 sync-mirror 作业：release 成功后把已发布资产原样同步到可选 S3 镜像
# （未配置镜像则跳过；镜像失败不影响已发布的 GitHub Release，可用 Re-run failed jobs 重跑）。
name: Release

on:
  push:
    tags:
      # tag 形如 v0.2.9；须为 annotated tag（其描述即发布日志），版本格式与一致性在首个步骤内严格校验
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 创建 Release 与上传资产需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 版本校验、三目标构建与发布
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 浅克隆会把 tag ref 解析到 commit，导致 annotated tag 被误判为轻量 tag。
          # 发布流程需要完整 tag object 来读取版本说明。
          fetch-depth: 0
          fetch-tags: true

      - name: 解析 tag 版本（唯一版本来源）
        # tag-only 发版：版本只从 annotated tag 解析，仓库内不再维护版本文件
        run: |
          set -euo pipefail
          version="$(bash scripts/tag-version.sh)"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "[release] 版本取自 tag：v${version}"

      - name: 生成 release-notes.md（取自 annotated tag 描述）
        # 发布日志唯一来源：annotated tag 的 message。subject + body 时取 body，纯多行列表
        # 原样保留；轻量 tag 或描述为空时在此失败，发布不会继续。
        run: bash scripts/tag-release-notes.sh

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/frp/go.sum
            third_party/wails/go.sum

      - name: 安装 wails3 CLI（固定 v3.0.0-beta.28，与 go.mod 一致）
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version

      - name: 确认 Runner 自带 Node（不安装任何 npm 依赖）
        run: node --version

      - name: 单元测试
        run: go test ./...

      - name: 前端多服务端行为验证（零依赖 Node 脚本）
        run: node scripts/verify-multiserver-ui.mjs

      - name: 双语词典校验（零依赖 Node 脚本）
        run: node scripts/verify-i18n.mjs

      - name: 三目标发行构建（复用 build.sh，注入 GitHub 更新源与可选镜像根）
        # FRPDESK_VERSION 显式传入 tag 版本；更新源在此处注入：主源固定指向本仓库
        # Release（由 GITHUB_REPOSITORY 推导，fork 发布时自动指向 fork 自己）；
        # UPDATE_MIRROR_BASE_URL 来自仓库 Variable，未配置时为空，build.sh 跳过镜像注入，
        # 应用内更新行为不变
        env:
          UPDATE_MANIFEST_URL: '${{ github.server_url }}/${{ github.repository }}/releases/latest/download/stable.json'
          UPDATE_MIRROR_BASE_URL: '${{ vars.UPDATE_MIRROR_BASE_URL }}'
        run: FRPDESK_VERSION="${VERSION}" bash build.sh

      - name: 打包三平台产物与许可文档包（按 VERSION 命名）
        run: |
          set -euo pipefail
          ditto -c -k --keepParent --norsrc "bin/frpdesk-darwin-arm64.app" "bin/frpdesk-${VERSION}-darwin-arm64.zip"
          ditto -c -k --keepParent --norsrc "bin/frpdesk-darwin-amd64.app" "bin/frpdesk-${VERSION}-darwin-amd64.zip"
          cp "bin/frpdesk-windows-amd64.exe" "bin/frpdesk-${VERSION}-windows-amd64.exe"
          bash scripts/stage-license-docs.sh "bin/frpdesk-${VERSION}-licenses"
          ditto -c -k --norsrc "bin/frpdesk-${VERSION}-licenses" "bin/frpdesk-${VERSION}-licenses.zip"
          rm -rf "bin/frpdesk-${VERSION}-licenses"
          ls -lh bin/frpdesk-*

      - name: 生成 Wails updater stable.json（stable 通道，notes 取自 annotated tag 描述）
        env:
          # 产物下载根：GitHub Release 固定资产路径（由仓库推导，支持 fork）
          DOWNLOAD_BASE_URL: '${{ github.server_url }}/${{ github.repository }}/releases/download'
        run: |
          set -euo pipefail
          wails3 updater manifest \
            -version "${VERSION}" \
            -channel stable \
            -name "Frpdesk v${VERSION}" \
            -url-prefix "${DOWNLOAD_BASE_URL}/v${VERSION}/" \
            -notes-file release-notes.md \
            -output bin/stable.json \
            "bin/frpdesk-${VERSION}-darwin-arm64.zip" \
            "bin/frpdesk-${VERSION}-darwin-amd64.zip" \
            "bin/frpdesk-${VERSION}-windows-amd64.exe"
          # 逐产物核对摘要，清单缺失/损坏时在发布前失败
          wails3 updater verify -manifest bin/stable.json -dir bin

      - name: 创建 Draft Release 并上传 5 个资产
        # gh help release create 说明直接带资产会先建 draft、传完再发布；为不依赖
        # Runner 上 gh 版本的具体实现，这里显式走 draft → upload → edit 发布。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Frpdesk v${VERSION}" \
            --notes-file release-notes.md
          gh release upload "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            "bin/frpdesk-${VERSION}-darwin-arm64.zip" \
            "bin/frpdesk-${VERSION}-darwin-amd64.zip" \
            "bin/frpdesk-${VERSION}-windows-amd64.exe" \
            "bin/frpdesk-${VERSION}-licenses.zip" \
            "bin/stable.json"

      - name: 校验 draft 资产齐全后发布（latest 指向的 stable.json 已就位）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected_assets="$(
            printf '%s\n' \
              "frpdesk-${VERSION}-darwin-arm64.zip" \
              "frpdesk-${VERSION}-darwin-amd64.zip" \
              "frpdesk-${VERSION}-windows-amd64.exe" \
              "frpdesk-${VERSION}-licenses.zip" \
              "stable.json" | sort
          )"
          actual_assets="$(gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "[release] draft 资产与预期不符，拒绝发布：" >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi
          gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "[release] 已发布 v${VERSION}（5 个资产齐全，latest/download/stable.json 生效）"

  # 可选镜像同步：独立作业，仅依赖 GitHub Release 发布成功；从已发布资产重新下载后
  # 原样同步（不重新构建），保证镜像与 GitHub 产物逐字节一致。放在独立作业是为了
  # 镜像失败可用 Re-run failed jobs 单独重跑，不会重跑 release 作业里的 gh release create。
  sync-mirror:
    name: 可选 S3 镜像同步（未配置则跳过）
    needs: release
    # vars 只能感知 Variable：仅配置了 Secret 而完全没配 Variable 的异常组合不会进入本作业；
    # 任何 Variable 已配置但必填项不全的组合会进入作业并由脚本明确报错
    if: ${{ needs.release.result == 'success' && (vars.UPDATE_MIRROR_BASE_URL != '' || vars.MIRROR_S3_ENDPOINT != '' || vars.MIRROR_S3_BUCKET != '') }}
    permissions:
      contents: read
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析 tag 版本（与 release 共用 scripts/tag-version.sh）
        run: |
          set -euo pipefail
          version="$(bash scripts/tag-version.sh)"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "[mirror] 目标版本：v${version}（与 release 作业发布内容的一致性由镜像脚本按清单校验）"

      - name: 下载已发布 Release 资产（镜像唯一来源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p mirror-staging
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir mirror-staging
          ls -lh mirror-staging

      - name: 核对 licenses.zip 与 GitHub 服务端摘要（stable.json 不覆盖该资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="frpdesk-${VERSION}-licenses.zip"
          path="mirror-staging/${asset}"
          if [ ! -f "$path" ]; then
            echo "[mirror] 已发布资产缺少 ${asset}" >&2
            exit 1
          fi
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq ".assets[] | select(.name == \"${asset}\") | .digest // \"\"")"
          if [ -z "$digest" ]; then
            echo "[mirror] GitHub 未返回资产摘要，跳过服务端核对（镜像脚本仍会做上传回读校验）"
            exit 0
          fi
          algo="${digest%%:*}"
          hex="${digest#*:}"
          if [ "$algo" != "sha256" ] || [ -z "$hex" ]; then
            echo "[mirror] GitHub 返回未知摘要格式：${digest}，跳过服务端核对"
            exit 0
          fi
          actual="$(shasum -a 256 "$path" | awk '{print $1}')"
          if [ "$actual" != "$hex" ]; then
            echo "[mirror] ${asset} sha256 与 GitHub 服务端不一致：本地 ${actual} ≠ 远端 ${hex}" >&2
            exit 1
          fi
          echo "[mirror] ${asset} sha256 与 GitHub 服务端一致"

      - name: 确保 rclone 可用（缺失时 Homebrew 公共安装）
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null 2>&1; then
            echo "[mirror] runner 未预装 rclone，通过 Homebrew 安装公共版本"
            brew install rclone
          fi
          rclone version | head -1

      - name: 同步到镜像（未配置镜像时脚本跳过；任何失败本作业显式变红）
        env:
          UPDATE_MIRROR_BASE_URL: ${{ vars.UPDATE_MIRROR_BASE_URL }}
          MIRROR_S3_ENDPOINT: ${{ vars.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ vars.MIRROR_S3_BUCKET }}
          MIRROR_S3_PREFIX: ${{ vars.MIRROR_S3_PREFIX }}
          MIRROR_S3_REGION: ${{ vars.MIRROR_S3_REGION }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bash scripts/publish-mirror.sh \
            --version "${VERSION}" \
            --manifest "mirror-staging/stable.json" \
            --artifacts-dir "mirror-staging" \
            --extra-file "mirror-staging/frpdesk-${VERSION}-licenses.zip"
