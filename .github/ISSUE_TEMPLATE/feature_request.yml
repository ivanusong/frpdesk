name: Feature request
description: 提出一个功能建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题 / Problem
      description: 你在什么使用场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 考虑过的其他做法（可选）
    validations:
      required: false